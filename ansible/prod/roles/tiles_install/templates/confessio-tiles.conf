# Self-hosted vector tiles. The tileset is one PMTiles archive that MapLibre reads
# with byte-range requests, so there is no tile server here -- only static files.
location ^~ /tiles/ {
    # root, not alias: the nested location below inherits a root, not an alias.
    root {{ tiles_root }};

    # PMTiles is compressed internally, and re-encoding it breaks the range reads
    # the format is built on.
    gzip off;

    # Public data, and it lets staging and dev servers use the production tiles.
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control "public, max-age=2592000" always;

    # The archive keeps its name across refreshes. A day of caching is safe: the
    # pmtiles client compares ETags and reloads past the cache when the file changed.
    # Declaring any add_header here discards every header inherited from the block
    # above, so the whole set is repeated.
    location = /tiles/france.pmtiles {
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "public, max-age=86400" always;
        # Lets that ETag check work from staging and dev, which are cross-origin.
        add_header Access-Control-Expose-Headers "ETag" always;
    }
}
